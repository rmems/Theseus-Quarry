[workspace]
resolver = "3"
members = [
    "crates/mining-telemetry-core",
    "crates/telemetry-collector",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
mining-telemetry-core = { path = "./crates/mining-telemetry-core" }
walkdir = "2"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27.1", features = ["process", "signal"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
nvml-wrapper = "0.9.0"
clap = { version = "4.0", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
