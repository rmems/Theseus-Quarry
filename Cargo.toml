[workspace]
resolver = "3"
members = [
    "crates/mining-telemetry-core",
    "crates/telemetry-collector",
]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
mining-telemetry-core = { path = "./crates/mining-telemetry-core" }
walkdir = "2"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27.1", features = ["process", "signal"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
nvml-wrapper = "0.9.0"
clap = { version = "4.0", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
rolling-file = "0.2.0"

# Explicit workspace profiles (see REVIEW.md).
# Defaults remain sensible; release is tuned for the long-running collector binary.

[profile.dev]
# Line tables only: faster incremental builds while keeping usable backtraces.
debug = 1

[profile.test]
# Inherit default test profile (debug assertions on). Documented for clarity.
debug = 1

[profile.bench]
# Scaffold for future criterion benches; avoid LTO until benches exist and need it.
lto = false
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Panic abort is intentional for a daemon: smaller binary, restart via systemd.
panic = "abort"
