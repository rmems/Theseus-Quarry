# Source-only CI: fmt, clippy, test on self-hosted GPU-capable runner.
# Uses latest stable Rust (dtolnay/rust-toolchain@stable tracks current stable).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    # ShipOfTheseus-class runner: GPU host, CUDA/Docker capable
    runs-on: [self-hosted, Linux, X64, ryzen]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
          rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: theseus-quarry-ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
