# Source-only CI: Rust quality checks on GitHub-hosted runners.
# Latest stable Rust (dtolnay/rust-toolchain@stable + rust-toolchain.toml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ensure rustup (prefer over distro rustc)
        run: |
          set -euo pipefail
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "Installing rustup..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
              --default-toolchain none \
              --profile minimal
          fi
          # System rustup may exist without $HOME/.cargo/env (set -e would abort).
          # shellcheck disable=SC1091
          if [ -f "${HOME}/.cargo/env" ]; then
            . "${HOME}/.cargo/env"
          fi
          rustup --version

      - name: Install latest stable Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy, rust-src

      - name: Show toolchain
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          if [ -f "${HOME}/.cargo/env" ]; then
            . "${HOME}/.cargo/env"
          fi
          which rustc cargo rustup
          rustc --version --verbose
          cargo --version
          rustup show
          rustup component list --installed | grep -E 'rustfmt|clippy|rust-src' || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: theseus-quarry-ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build release (telemetry-collector)
        run: cargo build -p telemetry-collector --release --locked
