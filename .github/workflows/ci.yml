# Source-only CI: Rust quality + Qodana on self-hosted GPU-capable runner.
# Latest stable Rust (dtolnay/rust-toolchain@stable + rust-toolchain.toml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  check:
    name: fmt · clippy · test
    # ShipOfTheseus-class runner: GPU host, CUDA/Docker capable
    runs-on: [self-hosted, Linux, X64, ryzen]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rustup (prefer over distro rustc)
        run: |
          set -euo pipefail
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "Installing rustup..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
              --default-toolchain none \
              --profile minimal
          fi
          # shellcheck disable=SC1091
          . "${HOME}/.cargo/env"
          rustup --version

      - name: Install latest stable Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src

      - name: Show toolchain
        run: |
          set -euo pipefail
          . "${HOME}/.cargo/env"
          which rustc cargo rustup
          rustc --version --verbose
          cargo --version
          rustup show
          rustup component list --installed | grep -E 'rustfmt|clippy|rust-src' || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: theseus-quarry-ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  qodana:
    name: qodana · rust
    runs-on: [self-hosted, Linux, X64, ryzen]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Rust scan
        env:
          # Prefer local EAP image already on the runner; qodana.yaml sets linter
          QODANA_IMAGE: jetbrains/qodana-rust:2026.1-eap
        run: |
          set -euo pipefail
          RESULTS="${{ runner.temp }}/qodana-results"
          mkdir -p "$RESULTS"

          if command -v qodana >/dev/null 2>&1; then
            qodana scan \
              --config qodana.yaml \
              --image "${QODANA_IMAGE}" \
              --project-dir . \
              --results-dir "$RESULTS" \
              --print-problems \
              --skip-pull
          else
            echo "qodana CLI not on PATH; running via Docker image"
            docker run --rm \
              -v "$PWD:/data/project" \
              -v "$RESULTS:/data/results" \
              "${QODANA_IMAGE}" \
              --config qodana.yaml \
              --print-problems
          fi

      - name: Upload Qodana SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-sarif
          path: |
            ${{ runner.temp }}/qodana-results/qodana.sarif.json
            ${{ runner.temp }}/qodana-results/qodana-short.sarif.json
          if-no-files-found: warn
