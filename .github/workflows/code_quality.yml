# Official JetBrains Qodana Cloud workflow (requires secrets.QODANA_TOKEN).
# Project config: qodana.yaml (linter: qodana-rust).

name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

env:
  QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

jobs:
  qodana:
    # Skip Cloud scans when the Qodana token is not configured (forks, Dependabot, etc.).
    if: env.QODANA_TOKEN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR: actual head commit (not the merge commit). Push/dispatch: current SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          pr-mode: false
          args: --config,qodana.yaml
        env:
          QODANA_TOKEN: ${{ env.QODANA_TOKEN }}
          QODANA_ENDPOINT: "https://qodana.cloud"
